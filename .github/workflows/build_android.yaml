name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build_apk:
    name: Build LEAP Demo APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Enable Gradle wrapper execution
        run: chmod +x gradlew

      - name: Install Android SDK Platform 36
        run: echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36"

      - name: Build debug APK (debug-signed, installable)
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: leap-demo-debug
          path: app/build/outputs/apk/debug/*.apk

      # --- Release signed APK ---
      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > /tmp/leap-keystore.p12

      - name: Build release APK (unsigned)
        run: ./gradlew assembleRelease --no-daemon

      - name: Sign release APK with apksigner
        run: |
          cp app/build/outputs/apk/release/app-release-unsigned.apk /tmp/app-release-signed.apk
          $ANDROID_HOME/build-tools/*/apksigner sign \
            --ks /tmp/leap-keystore.p12 \
            --ks-type PKCS12 \
            --ks-pass "pass:${{ secrets.KEYSTORE_PASSWORD }}" \
            --key-pass "pass:${{ secrets.KEY_PASSWORD }}" \
            --ks-key-alias "${{ secrets.KEY_ALIAS }}" \
            --out /tmp/leap-demo-release-signed.apk \
            app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Verify signature
        run: $ANDROID_HOME/build-tools/*/apksigner verify --verbose /tmp/leap-demo-release-signed.apk

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: leap-demo-release-signed
          path: /tmp/leap-demo-release-signed.apk
